<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deal Evaluator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Deal Evaluator</h1>
    <p class="sub">Model the cash flows, rate the soft factors, get a verdict.</p>
  </header>

  <main>
    <section class="card" id="inputs">
      <h2>Deal</h2>
      <label>Deal name <input id="name" type="text" value="Acme Widgets acquisition" /></label>
      <div class="grid2">
        <label>Upfront investment ($) <input id="investment" type="number" min="0" step="1000" value="500000" /></label>
        <label>Discount / hurdle rate (%) <input id="discountRate" type="number" step="0.5" value="10" /></label>
        <label>Year‑1 net cash flow ($) <input id="year1" type="number" step="1000" value="120000" /></label>
        <label>Annual growth (%) <input id="growth" type="number" step="0.5" value="5" /></label>
        <label>Holding period (years) <input id="years" type="number" min="1" max="30" value="5" /></label>
        <label>Exit / terminal value ($) <input id="exitValue" type="number" step="1000" value="250000" /></label>
      </div>
      <label>Custom yearly cash flows <span class="hint">(optional, comma‑separated — overrides year‑1 &amp; growth)</span>
        <input id="customFlows" type="text" placeholder="e.g. 80000, 110000, 150000, 160000" />
      </label>

      <h2>Qualitative factors <span class="hint">rate 1 (poor) – 5 (excellent)</span></h2>
      <div id="criteria"></div>

      <div class="actions">
        <button id="save">Save deal</button>
        <button id="export" class="ghost">Export JSON</button>
        <label class="ghost file">Import JSON <input id="import" type="file" accept="application/json" hidden /></label>
      </div>
    </section>

    <section class="results">
      <div class="card verdict" id="verdictCard">
        <div>
          <div class="label">Verdict</div>
          <div class="verdict-text" id="verdict">—</div>
        </div>
        <div class="scores">
          <div><span id="overall">—</span><small>Overall</small></div>
          <div><span id="finScore">—</span><small>Financial</small></div>
          <div><span id="qualScore">—</span><small>Qualitative</small></div>
        </div>
      </div>

      <div class="card">
        <h2>Metrics</h2>
        <div class="metrics" id="metrics"></div>
      </div>

      <div class="card">
        <h2>Cash flows</h2>
        <div id="chart" class="chart"></div>
      </div>

      <div class="card">
        <h2>Sensitivity <span class="hint">NPV by discount rate (rows) × cash‑flow change (cols)</span></h2>
        <div class="table-wrap"><table id="sens"></table></div>
      </div>

      <div class="card">
        <h2>Saved deals</h2>
        <div class="table-wrap"><table id="saved"></table></div>
        <p class="hint" id="noSaved">No saved deals yet.</p>
      </div>
    </section>
  </main>

  <script src="finance.js"></script>
  <script src="app.js"></script>
</body>
</html>
